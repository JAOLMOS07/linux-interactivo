<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Laboratorio Linux</title>
<meta name="description" content="Aprende Linux desde cero con una terminal simulada: teoría, retos prácticos y simuladores de Sistemas Operativos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: app de una pantalla. Barra superior + vista (ruta | lección a dos columnas | terminal libre | chuleta) */
:root {
  --bg: #eef0ea;
  --surface: #fbfcf9;
  --surface-2: #e4e8e0;
  --ink: #1b2420;
  --muted: #56645d;
  --line: #d3d9cf;
  --accent: #e8a317;
  --accent-ink: #8a5a00;
  --accent-soft: #fbefd2;
  --ok: #1d7a5f;
  --ok-soft: #dcefe6;
  --bad: #b23a2c;
  --info-soft: #e3ecf5;
  --info-ink: #24527a;
  --term-bg: #121815;
  --term-fg: #d5ddd8;
  --term-dim: #7f8d86;
  --term-line: #26302b;
  --t-prompt: #7fd3b4;
  --t-path: #f2b632;
  --t-root: #ff7b6b;
  --t-blue: #7aa8ff;
  --t-green: #8ee08a;
  --t-red: #ff6b6b;
  --t-mag: #e292f0;
  --t-cyan: #6fd8e8;
  --t-yel: #f2d06b;
  --g1: #3a7bd5; --g2: #d9822b; --g3: #2e9e6a; --g4: #b94fb5; --g5: #c9463d; --g6: #6b7a8f;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --surface: #171d1a; --surface-2: #202823; --ink: #e5ebe7; --muted: #98a69f; --line: #2b3530;
    --accent: #f0b232; --accent-ink: #f5c45a; --accent-soft: #3a2f16; --ok: #4fc495; --ok-soft: #173327; --bad: #ff7b6b;
    --info-soft: #18283a; --info-ink: #9cc4ec; --term-bg: #0b0f0d; --term-line: #222b26;
    --g1: #5b95e6; --g2: #e69a4c; --g3: #4cbb86; --g4: #cf6fcb; --g5: #e0645a; --g6: #8b99ad;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171d1a; --surface-2: #202823; --ink: #e5ebe7; --muted: #98a69f; --line: #2b3530;
  --accent: #f0b232; --accent-ink: #f5c45a; --accent-soft: #3a2f16; --ok: #4fc495; --ok-soft: #173327; --bad: #ff7b6b;
  --info-soft: #18283a; --info-ink: #9cc4ec; --term-bg: #0b0f0d; --term-line: #222b26;
  --g1: #5b95e6; --g2: #e69a4c; --g3: #4cbb86; --g4: #cf6fcb; --g5: #e0645a; --g6: #8b99ad;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd, pre { font-family: var(--f-mono); }
code { font-size: .88em; background: var(--surface-2); padding: .08em .35em; border-radius: 4px; }
kbd { font-size: .8em; border: 1px solid var(--line); border-bottom-width: 2px; padding: .05em .4em; border-radius: 4px; background: var(--surface); }

.app { display: flex; flex-direction: column; height: 100%; }
/* ---------- barra superior ---------- */
.top { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.mark { width: 34px; height: 34px; border-radius: 7px; background: var(--term-bg); color: var(--t-path); display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-weight: 700; font-size: 15px; }
.mark span { color: var(--t-prompt); }
.brand b { font-family: var(--f-display); font-size: 19px; font-weight: 700; letter-spacing: -.01em; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: 12px; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav button { border: 0; background: none; padding: 7px 12px; border-radius: 6px; color: var(--muted); font-weight: 700; font-size: 14px; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.overall { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; transition: width .4s; }

.view { flex: 1; min-height: 0; overflow: auto; }
.view[hidden] { display: none !important; }

/* ---------- ruta (inicio) ---------- */
.home { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; align-items: center; margin-bottom: 36px; }
.hero h1 { font-family: var(--f-display); font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; letter-spacing: -.025em; margin: 0 0 14px; text-wrap: balance; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--accent-ink); }
.hero p { color: var(--muted); font-size: 16.5px; max-width: 54ch; margin: 0 0 20px; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 7px; font-weight: 700; font-size: 14.5px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #241800; }
.btn.pri:hover { filter: brightness(1.05); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.demo { background: var(--term-bg); color: var(--term-fg); border-radius: 10px; padding: 16px 18px; font-family: var(--f-mono); font-size: 13px; line-height: 1.6; box-shadow: 0 18px 40px -24px rgba(0,0,0,.6); min-width: 0; overflow: hidden; }
.demo .l { white-space: pre-wrap; word-break: break-word; }
.demo .ok { color: var(--t-green); }
.stats { display: flex; gap: 22px; margin-top: 22px; flex-wrap: wrap; }
.stats div { font-size: 13px; color: var(--muted); }
.stats b { display: block; font-family: var(--f-display); font-size: 24px; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; flex-wrap: wrap; }
.sec-h h2 { font-family: var(--f-display); font-size: 22px; margin: 0; letter-spacing: -.01em; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13.5px; }
.phase { margin-bottom: 26px; }
.phase h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, transform .15s; min-width: 0; }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.card .n .st { font-family: var(--f-body); font-weight: 700; }
.card .n .st.done { color: var(--ok); }
.card .n .st.go { color: var(--accent-ink); }
.card h4 { margin: 0; font-family: var(--f-display); font-size: 17px; line-height: 1.2; letter-spacing: -.005em; }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; flex: 1; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.os { background: var(--info-soft); color: var(--info-ink); }
.card .bar { width: 100%; margin-top: 6px; }

/* ---------- lección ---------- */
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); height: 100%; }
.lesson-l { overflow: auto; border-right: 1px solid var(--line); background: var(--surface); }
.lesson-r { min-width: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.lhead { padding: 18px 26px 0; position: sticky; top: 0; background: var(--surface); z-index: 2; border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 700; }
.lhead h1 { font-family: var(--f-display); font-size: 26px; line-height: 1.15; margin: 6px 0 8px; letter-spacing: -.02em; text-wrap: balance; }
.tabs { display: none; gap: 2px; margin-top: 10px; }
.tabs button { flex: 1; border: 0; background: none; padding: 9px 0; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.lnav { display: flex; justify-content: space-between; gap: 8px; padding: 10px 0 12px; }
.theory { padding: 6px 26px 40px; max-width: 72ch; }
.theory h2 { font-family: var(--f-display); font-size: 19px; margin: 26px 0 8px; letter-spacing: -.01em; }
.theory p, .theory li { font-size: 15px; }
.theory ul, .theory ol { padding-left: 20px; }
.theory table.t { border-collapse: collapse; width: 100%; font-size: 14px; margin: 10px 0 14px; display: block; overflow-x: auto; }
.theory table.t td, .theory table.t th { border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; vertical-align: top; text-align: left; }
.theory table.t th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.theory table.t td:first-child { white-space: nowrap; }
pre.ex { background: var(--surface-2); padding: 12px 14px; border-radius: var(--r); font-size: 13px; overflow-x: auto; line-height: 1.55; margin: 10px 0 14px; }
pre.ex .pu { color: var(--ok); font-weight: 700; } pre.ex .ph { color: var(--info-ink); } pre.ex .pp { color: var(--accent-ink); font-weight: 700; }
pre.try { background: var(--term-bg); color: var(--term-fg); padding: 9px 14px 9px 34px; border-radius: var(--r); font-size: 13.5px; margin: 6px 0; cursor: pointer; position: relative; overflow-x: auto; border: 1px solid transparent; transition: border-color .15s; }
pre.try::before { content: "▸"; position: absolute; left: 14px; color: var(--t-path); }
pre.try:hover { border-color: var(--accent); }
pre.try:hover::after { content: "copiar a la terminal"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-family: var(--f-body); font-size: 11px; color: var(--term-dim); }
.so, .warn { border-radius: var(--r); padding: 12px 14px; margin: 16px 0; font-size: 14.5px; }
.so { background: var(--info-soft); color: var(--ink); }
.so b:first-child { display: block; color: var(--info-ink); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
.warn { background: var(--accent-soft); }
.warn b:first-child { color: var(--accent-ink); margin-right: 4px; }
svg.diag { width: 100%; max-width: 520px; height: auto; display: block; margin: 12px 0; }
svg.diag .st rect { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
svg.diag .st.on rect { fill: var(--accent-soft); stroke: var(--accent-ink); }
svg.diag text { font-family: var(--f-body); font-size: 13px; fill: var(--ink); text-anchor: middle; font-weight: 700; }
svg.diag text.s { font-size: 10.5px; fill: var(--muted); font-weight: 400; }
svg.diag .ln { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg.diag .ah { fill: var(--muted); }

/* tareas */
.tasks { border-bottom: 1px solid var(--line); background: var(--surface); max-height: 46%; overflow: auto; flex-shrink: 0; }
.tasks-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px 6px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.tasks-h b { font-family: var(--f-display); font-size: 16px; }
.tasks-h span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.task { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 9px 18px; border-top: 1px solid transparent; }
.task .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); margin-top: 1px; display: grid; place-items: center; font-size: 12px; color: #fff; }
.task.done .dot { background: var(--ok); border-color: var(--ok); }
.task.cur { background: var(--accent-soft); }
.task.cur .dot { border-color: var(--accent-ink); }
.task.todo { opacity: .62; }
.task .tx { font-size: 14.5px; }
.task.done .tx { color: var(--muted); }
.task .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 13.5px; color: var(--ink); background: var(--surface); border-left: 3px solid var(--accent); padding: 6px 10px; margin-top: 7px; border-radius: 0 6px 6px 0; }
.hint code.sol { cursor: pointer; }
.ans { display: flex; gap: 6px; margin-top: 7px; }
.ans input { width: 120px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
.ans .msg { font-size: 13px; align-self: center; }
.ans .msg.bad { color: var(--bad); }
.donebox { margin: 10px 18px 14px; padding: 14px 16px; background: var(--ok-soft); border-radius: 10px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.donebox b { font-family: var(--f-display); font-size: 17px; display: block; }
.donebox span { font-size: 13.5px; color: var(--muted); }

/* terminal */
.term { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: 13.5px; position: relative; }
.term-h { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--term-line); font-size: 12px; color: var(--term-dim); }
.term-h .dots { display: flex; gap: 5px; }
.term-h .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--term-line); }
.term-h .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.term-h button { border: 1px solid var(--term-line); background: none; color: var(--term-dim); font-family: var(--f-body); font-size: 12px; padding: 3px 9px; border-radius: 5px; }
.term-h button:hover { color: var(--term-fg); border-color: var(--term-dim); }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 14px 6px; line-height: 1.5; cursor: text; }
.screen .ln { white-space: pre-wrap; word-break: break-word; min-height: 1.5em; }
.screen .err { color: #ffb4a8; }
.screen .sys { color: var(--term-dim); font-style: italic; }
.screen .tsk { color: var(--t-green); }
.inrow { display: flex; align-items: baseline; flex-wrap: wrap; }
.inrow .ps { white-space: pre; }
.inrow input { flex: 1; min-width: 120px; background: none; border: 0; outline: none; color: var(--term-fg); font: inherit; padding: 0; caret-color: var(--t-path); }
.pu { color: var(--t-prompt); font-weight: 700; } .pu.root { color: var(--t-root); }
.pp { color: var(--t-blue); font-weight: 700; }
.a1 { font-weight: 700; } .a2 { color: var(--term-dim); } .a7 { background: var(--term-fg); color: var(--term-bg); }
.a31 { color: var(--t-red); } .a32 { color: var(--t-green); } .a33 { color: var(--t-yel); } .a34 { color: var(--t-blue); } .a35 { color: var(--t-mag); } .a36 { color: var(--t-cyan); }
.keys { min-width: 0; display: none; gap: 5px; padding: 6px 8px; border-top: 1px solid var(--term-line); overflow-x: auto; }
.keys button { flex: 0 0 auto; background: var(--term-line); border: 0; color: var(--term-fg); font-family: var(--f-mono); font-size: 13px; padding: 6px 10px; border-radius: 5px; min-width: 36px; }
/* nano */
.nano { position: absolute; inset: 0; background: var(--term-bg); display: flex; flex-direction: column; z-index: 5; }
.nano-h { background: var(--term-fg); color: var(--term-bg); padding: 3px 12px; display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
.nano textarea { flex: 1; background: none; border: 0; outline: none; resize: none; color: var(--term-fg); font: inherit; padding: 8px 12px; line-height: 1.5; }
.nano-msg { text-align: center; font-size: 12.5px; min-height: 1.6em; padding: 2px; }
.nano-msg span { background: var(--term-fg); color: var(--term-bg); padding: 0 6px; }
.nano-f { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 4px 12px 8px; font-size: 12.5px; }
.nano-f button { background: none; border: 0; color: var(--term-fg); padding: 2px 0; font: inherit; }
.nano-f button b { background: var(--term-fg); color: var(--term-bg); padding: 0 4px; margin-right: 5px; font-weight: 400; }

/* simuladores */
.lab { flex: 1; min-height: 0; overflow: auto; padding: 16px 18px 30px; }
.lab h3 { font-family: var(--f-display); font-size: 16px; margin: 0 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 11px; font-size: 13px; font-weight: 700; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.ctrls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.ctrls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ctrls input[type=number], .ctrls input[type=text] { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
.ptable { border-collapse: collapse; font-size: 13.5px; margin-bottom: 8px; }
.ptable th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; padding: 4px 8px 4px 0; font-weight: 700; }
.ptable td { padding: 3px 8px 3px 0; }
.ptable input { width: 64px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; }
.ptable .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.wrapx { overflow-x: auto; max-width: 100%; }
.gantt { margin: 16px 0 6px; min-width: 360px; padding-right: 14px; }
.gbar { display: flex; height: 40px; border-radius: 6px; overflow: hidden; }
.gbar div { display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; border-right: 1px solid rgba(255,255,255,.5); min-width: 0; animation: grow .45s ease-out both; transform-origin: left; }
.gbar div.idle { background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 4px, var(--line) 4px, var(--line) 8px); color: var(--muted); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.gaxis { position: relative; height: 20px; font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }
.gaxis span { position: absolute; transform: translateX(-50%); top: 3px; }
.mtable { border-collapse: collapse; font-size: 13.5px; width: 100%; margin-top: 10px; font-variant-numeric: tabular-nums; }
.mtable th, .mtable td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--line); }
.mtable th:first-child, .mtable td:first-child { text-align: left; }
.mtable th { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.mtable tfoot td { font-weight: 700; border-bottom: 0; }
.kpis { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 110px; }

<script>
// ================= MOTOR: sistema de archivos virtual + shell =================
const Engine = (() => {
  const HOST = 'linux-trainee';
  const ESC = '\x1b[';
  const C = {
    dir: ESC + '1;34m', exe: ESC + '1;32m', lnk: ESC + '1;36m', red: ESC + '1;31m',
    mag: ESC + '35m', grn: ESC + '32m', yel: ESC + '33m', bold: ESC + '1m', dim: ESC + '2m', off: ESC + '0m',
    arc: ESC + '1;31m'
  };
  const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const MONTHS_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const DAYS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  const DAYS_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const E_NOENT = 'No existe el archivo o el directorio';
  const E_ACCES = 'Permiso denegado';
  const E_ISDIR = 'Es un directorio';
  const E_NOTDIR = 'No es un directorio';
  const E_PERM = 'Operación no permitida';

  class ShellError extends Error { constructor(msg, code = 1) { super(msg); this.code = code; } }
  class ExitSignal { constructor(code) { this.code = code; } }
  class Incomplete extends Error { constructor() { super('incompleto'); this.incomplete = true; } }

  // ---------- nodos ----------
  function mk(S, t, owner, group, mode, extra) {
    const n = { t, owner, group: group || owner, mode, mtime: Date.now(), ino: S.nextIno++, nlink: t === 'd' ? 2 : 1 };
    if (t === 'd') n.c = {};
    if (t === 'f') n.data = '';
    return Object.assign(n, extra || {});
  }

  // ---------- rutas ----------
  function norm(abs) {
    const out = [];
    for (const seg of abs.split('/')) {
      if (!seg || seg === '.') continue;
      if (seg === '..') out.pop(); else out.push(seg);
    }
    return '/' + out.join('/');
  }
  function homeOf(S, u) { return (S.users[u] && S.users[u].home) || '/'; }
  function abspath(S, p) {
    if (p === undefined || p === null) p = '';
    if (p === '~' || p.startsWith('~/')) p = homeOf(S, S.user) + p.slice(1);
    else if (/^~[a-z_][\w-]*/.test(p)) {
      const m = p.match(/^~([a-z_][\w-]*)(.*)$/);
      if (S.users[m[1]]) p = S.users[m[1]].home + m[2];
    }
    return norm(p.startsWith('/') ? p : S.cwd + '/' + p);
  }
  function dirname(p) { const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); }
  function basename(p) { if (p === '/') return '/'; return p.slice(p.lastIndexOf('/') + 1); }

  function inGroup(S, u, g) {
    if (!S.users[u]) return false;
    const ug = Object.keys(S.groups).find(k => S.groups[k].gid === S.users[u].gid);
    if (ug === g) return true;
    return !!(S.groups[g] && S.groups[g].members.includes(u));
  }
  function can(S, node, bit) {
    if (S.user === 'root') return bit !== 1 || node.t === 'd' || (node.mode & 0o111) !== 0;
    const shift = node.owner === S.user ? 6 : inGroup(S, S.user, node.group) ? 3 : 0;
    return ((node.mode >> shift) & bit) !== 0;
  }

  // Devuelve {node, parent, name, path} o {err}
  function lookup(S, abs, follow = true, depth = 0) {
    if (depth > 30) return { err: 'Demasiados niveles de enlaces simbólicos' };
    const parts = abs.split('/').filter(Boolean);
    let node = S.root, parent = null, cur = [];
    if (!parts.length) return { node, parent: S.root, name: '/', path: '/' };
    for (let i = 0; i < parts.length; i++) {
      if (node.t !== 'd') return { err: E_NOTDIR };
      if (!can(S, node, 1)) return { err: E_ACCES };
      const child = node.c[parts[i]];
      if (!child) return { err: E_NOENT, parent: i === parts.length - 1 ? node : null, name: parts[i] };
      const last = i === parts.length - 1;
      if (child.t === 'l' && (!last || follow)) {
        const base = '/' + cur.join('/');
        const tgt = child.target.startsWith('/') ? child.target : base + '/' + child.target;
        const rest = parts.slice(i + 1).join('/');
        return lookup(S, norm(tgt + (rest ? '/' + rest : '')), follow, depth + 1);
      }
      parent = node; node = child; cur.push(parts[i]);
    }
    return { node, parent, name: parts[parts.length - 1], path: '/' + cur.join('/') };
  }
  function get(S, p, follow = true) { return lookup(S, abspath(S, p), follow); }

  function readFile(S, p) {
    const r = get(S, p);
    if (r.err) throw new ShellError(r.err);
    if (r.node.t === 'd') throw new ShellError(E_ISDIR);
    if (!can(S, r.node, 4)) throw new ShellError(E_ACCES);
    if (r.node.dev === 'null') return '';
    if (r.node.dev === 'zero') return '';
    if (r.node.dev === 'random') return Math.random().toString(36).repeat(3);
    return r.node.data;
  }
  function writeFile(S, p, data, append = false) {
    const abs = abspath(S, p);
    let r = lookup(S, abs);
    if (r.err && r.err !== E_NOENT) throw new ShellError(r.err);
    if (!r.err) {
      if (r.node.t === 'd') throw new ShellError(E_ISDIR);
      if (r.node.dev === 'null') return;
      if (!can(S, r.node, 2)) throw new ShellError(E_ACCES);
      r.node.data = append ? r.node.data + data : data;
      r.node.mtime = Date.now();
      return r.node;
    }
    const pr = lookup(S, dirname(abs));
    if (pr.err) throw new ShellError(pr.err);
    if (pr.node.t !== 'd') throw new ShellError(E_NOTDIR);
    if (!can(S, pr.node, 2) || !can(S, pr.node, 1)) throw new ShellError(E_ACCES);
    const n = mk(S, 'f', S.user, primaryGroup(S, S.user), 0o666 & ~S.umask);
    n.data = data;
    pr.node.c[basename(abs)] = n;
    pr.node.mtime = Date.now();
    return n;
  }
  function primaryGroup(S, u) {
    const gid = S.users[u] ? S.users[u].gid : 0;
    return Object.keys(S.groups).find(k => S.groups[k].gid === gid) || u;
  }

  // Construcción directa (sin comprobar permisos), útil para setup
  function put(S, path, data, opts = {}) {
    const parts = path.split('/').filter(Boolean);
    let node = S.root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node.c[parts[i]]) node.c[parts[i]] = mk(S, 'd', opts.owner || 'root', opts.group, 0o755);
      node = node.c[parts[i]];
      if (node.t === 'l') node = lookup(S, abspath(S, node.target)).node;
    }
    const name = parts[parts.length - 1];
    const owner = opts.owner || 'root';
    let n;
    if (data === null) n = node.c[name] && node.c[name].t === 'd' ? node.c[name] : mk(S, 'd', owner, opts.group, opts.mode ?? 0o755);
    else if (opts.link) n = mk(S, 'l', owner, opts.group, 0o777, { target: opts.link });
    else { n = mk(S, 'f', owner, opts.group, opts.mode ?? 0o644); n.data = data; }
    if (opts.dev) n.dev = opts.dev;
    if (data !== null || !node.c[name]) node.c[name] = n;
    if (opts.mode !== undefined) n.mode = opts.mode;
    if (opts.owner) { n.owner = opts.owner; n.group = opts.group || opts.owner; }
    return n;
  }
  function del(S, path) {
    const r = lookup(S, abspath(S, path), false);
    if (!r.err && r.parent) { delete r.parent.c[r.name]; return true; }
    return false;
  }

  // ---------- sistema inicial ----------
  const BIN_CMDS = 'bash cat cp chmod chown chgrp date df du echo find grep gzip gunzip head hostname id kill killall less ln ls man mkdir more mv nano nice ps pwd renice rm rmdir sed sleep sort stat sudo su tail tar tee touch tr uname uniq wc which whoami cut diff file free groups ip ping pstree top uptime useradd userdel usermod groupadd passwd apt systemctl seq basename dirname env printenv cal clear history lsblk mount lscpu tac curl ss pgrep pkill journalctl umask'.split(' ');

  function createSystem() {
    const S = {
      nextIno: 2, user: 'estudiante', cwd: '/home/estudiante', umask: 0o002,
      env: {}, aliases: { ll: 'ls -alF', la: 'ls -A', l: 'ls -CF' }, history: [], lastCode: 0,
      users: {
        root: { uid: 0, gid: 0, home: '/root', shell: '/bin/bash', gecos: 'root' },
        daemon: { uid: 1, gid: 1, home: '/usr/sbin', shell: '/usr/sbin/nologin', gecos: 'daemon' },
        'www-data': { uid: 33, gid: 33, home: '/var/www', shell: '/usr/sbin/nologin', gecos: 'www-data' },
        estudiante: { uid: 1000, gid: 1000, home: '/home/estudiante', shell: '/bin/bash', gecos: 'Estudiante,,,' },
        profesor: { uid: 1001, gid: 1001, home: '/home/profesor', shell: '/bin/bash', gecos: 'Profesor,,,' }
      },
      groups: {
        root: { gid: 0, members: [] }, daemon: { gid: 1, members: [] }, adm: { gid: 4, members: ['estudiante'] },
        sudo: { gid: 27, members: ['estudiante'] }, 'www-data': { gid: 33, members: [] },
        estudiante: { gid: 1000, members: [] }, profesor: { gid: 1001, members: [] }
      },
      procs: [], nextPid: 2300, jobs: [], nextJob: 1, userStack: [],
      installed: [], services: {
        ssh: { desc: 'OpenBSD Secure Shell server', active: true, enabled: true, pid: 812 },
        cron: { desc: 'Regular background program processing daemon', active: true, enabled: true, pid: 790 },
        cups: { desc: 'CUPS Scheduler', active: false, enabled: false }
      },
      bootTime: Date.now() - 3 * 3600e3 - 17 * 60e3
    };
    S.root = mk(S, 'd', 'root', 'root', 0o755);
    const d = (p, o = {}) => put(S, p, null, o);
    ['boot', 'dev', 'etc', 'home', 'media', 'mnt', 'opt', 'proc', 'srv', 'sys', 'usr', 'usr/bin', 'usr/sbin', 'usr/lib', 'usr/local', 'usr/local/bin', 'usr/share', 'usr/share/doc', 'var', 'var/log', 'var/cache', 'var/lib', 'var/tmp', 'var/www', 'var/www/html', 'etc/ssh', 'etc/apt', 'etc/skel', 'boot/grub', 'var/spool', 'var/spool/cron'].forEach(p => d(p));
    d('tmp', { mode: 0o1777 });
    d('root', { mode: 0o700 });
    put(S, 'bin', '', { link: 'usr/bin' });
    put(S, 'sbin', '', { link: 'usr/sbin' });
    put(S, 'lib', '', { link: 'usr/lib' });
    BIN_CMDS.forEach(c => put(S, 'usr/bin/' + c, '\x7fELF (binario ejecutable)', { mode: 0o755 }));
    ['reboot', 'shutdown', 'fdisk', 'mkfs', 'ifconfig-no'].slice(0, 4).forEach(c => put(S, 'usr/sbin/' + c, '\x7fELF', { mode: 0o755 }));
    put(S, 'boot/vmlinuz-6.8.0-45-generic', '\x7fKERNEL', { mode: 0o600 });
    put(S, 'boot/initrd.img-6.8.0-45-generic', '\x7fINITRD', { mode: 0o644 });
    put(S, 'boot/grub/grub.cfg', '# Archivo generado por grub-mkconfig\nset default="0"\nset timeout=5\nmenuentry \'Ubuntu\' {\n  linux /boot/vmlinuz-6.8.0-45-generic root=/dev/sda1 ro quiet splash\n  initrd /boot/initrd.img-6.8.0-45-generic\n}\n', { mode: 0o444 });
    put(S, 'dev/null', '', { dev: 'null', mode: 0o666 });
    put(S, 'dev/zero', '', { dev: 'zero', mode: 0o666 });
    put(S, 'dev/random', '', { dev: 'random', mode: 0o666 });
    put(S, 'dev/sda', '', { dev: 'disk', mode: 0o660 });
    put(S, 'dev/sda1', '', { dev: 'disk', mode: 0o660 });
    put(S, 'dev/tty', '', { dev: 'tty', mode: 0o666 });
    put(S, 'etc/hostname', HOST + '\n');
    put(S, 'etc/hosts', '127.0.0.1\tlocalhost\n127.0.1.1\t' + HOST + '\n192.168.1.20\tservidor-web\n192.168.1.30\tbase-datos\n');
    put(S, 'etc/os-release', 'PRETTY_NAME="Ubuntu 24.04.1 LTS"\nNAME="Ubuntu"\nVERSION_ID="24.04"\nVERSION="24.04.1 LTS (Noble Numbat)"\nID=ubuntu\nID_LIKE=debian\nHOME_URL="https://www.ubuntu.com/"\n');
    put(S, 'etc/fstab', '# <sistema de archivos> <punto de montaje> <tipo> <opciones> <dump> <pass>\nUUID=3f1c-a9e2  /          ext4  errors=remount-ro  0  1\nUUID=7B2E-11F0  /boot/efi  vfat  umask=0077         0  1\n/swap.img       none       swap  sw                 0  0\n');
    put(S, 'etc/resolv.conf', 'nameserver 127.0.0.53\noptions edns0 trust-ad\n');
    put(S, 'etc/shells', '/bin/sh\n/bin/bash\n/usr/bin/bash\n/bin/dash\n');
    put(S, 'etc/timezone', 'America/Bogota\n');
    put(S, 'etc/crontab', '# /etc/crontab: crontab del sistema\n# m h dom mon dow user  command\n17 *  * * *  root  cd / && run-parts --report /etc/cron.hourly\n25 6  * * *  root  test -x /usr/sbin/anacron || run-parts --report /etc/cron.daily\n');

    put(S, 'etc/sudoers', '# Solo editar con visudo\nroot    ALL=(ALL:ALL) ALL\n%sudo   ALL=(ALL:ALL) ALL\n', { mode: 0o440 });
    const bashrc = '# ~/.bashrc: ejecutado por bash para shells interactivos\nHISTSIZE=1000\nalias ll=\'ls -alF\'\nalias la=\'ls -A\'\nalias l=\'ls -CF\'\nPS1=\'\\u@\\h:\\w\\$ \'\n';
    put(S, 'etc/skel/.bashrc', bashrc);
    put(S, 'etc/skel/.profile', '# ~/.profile: ejecutado por shells de inicio de sesión\nif [ -f "$HOME/.bashrc" ]; then\n  . "$HOME/.bashrc"\nfi\n');
    // /proc
    put(S, 'proc/cpuinfo', 'processor\t: 0\nvendor_id\t: GenuineIntel\nmodel name\t: Intel(R) Core(TM) i5-1135G7 @ 2.40GHz\ncpu MHz\t\t: 2419.200\ncache size\t: 8192 KB\ncpu cores\t: 4\n\nprocessor\t: 1\nvendor_id\t: GenuineIntel\nmodel name\t: Intel(R) Core(TM) i5-1135G7 @ 2.40GHz\ncpu MHz\t\t: 2419.200\ncache size\t: 8192 KB\ncpu cores\t: 4\n', { mode: 0o444 });
    put(S, 'proc/meminfo', 'MemTotal:        8034520 kB\nMemFree:         2864212 kB\nMemAvailable:    5321480 kB\nBuffers:          212344 kB\nCached:          2398112 kB\nSwapCached:            0 kB\nActive:          2970460 kB\nInactive:        1650304 kB\nSwapTotal:       2097148 kB\nSwapFree:        2097148 kB\nDirty:               208 kB\nPageTables:        38212 kB\nHugePages_Total:       0\nHugepagesize:       2048 kB\n', { mode: 0o444 });
    put(S, 'proc/version', 'Linux version 6.8.0-45-generic (buildd@lcy02-amd64-075) (x86_64-linux-gnu-gcc-13 (Ubuntu 13.2.0-23ubuntu4) 13.2.0) #45-Ubuntu SMP PREEMPT_DYNAMIC\n', { mode: 0o444 });
    put(S, 'proc/uptime', '11834.52 45120.33\n', { mode: 0o444 });
    put(S, 'proc/loadavg', '0.42 0.35 0.30 2/312 2299\n', { mode: 0o444 });
    // logs
    put(S, 'var/log/syslog', [
      'oct 13 01:10:02 linux-trainee systemd[1]: Started cron.service - Regular background program processing daemon.',
      'oct 13 01:10:03 linux-trainee kernel: [    0.000000] Linux version 6.8.0-45-generic',
      'oct 13 01:10:05 linux-trainee NetworkManager[655]: <info> device (enp0s3): state change: activated',
      'oct 13 02:30:11 linux-trainee CRON[1402]: (root) CMD (run-parts /etc/cron.hourly)',
      'oct 13 03:01:44 linux-trainee kernel: [ 6699.120044] EXT4-fs (sda1): re-mounted. Quota mode: none.',
      'oct 13 03:15:20 linux-trainee systemd[1]: Starting apt-daily.service - Daily apt download activities...'
    ].join('\n') + '\n', { group: 'adm', mode: 0o640 });
    put(S, 'var/log/auth.log', [
      'oct 13 02:01:13 linux-trainee sshd[1301]: Accepted password for estudiante from 192.168.1.15 port 52144 ssh2',
      'oct 13 02:45:52 linux-trainee sshd[1355]: Failed password for root from 203.0.113.7 port 40122 ssh2',

  def('ping', (a, ctx) => {
    const { o, rest } = getopt(a, '46qv', 'cWi');
    const h = rest[0];
    if (!h) { ctx.err('ping: dirección de destino requerida\n'); return 1; }
    const ip = /^\d+\.\d+\.\d+\.\d+$/.test(h) ? h : HOSTS[h];
    if (!ip) { ctx.err(`ping: ${h}: Nombre o servicio desconocido\n`); return 2; }
    const unreachable = ip.startsWith('10.') || ip === '192.168.1.99';
    const n = o.c ? parseInt(o.c, 10) : 4;
    const base = ip.startsWith('127.') ? 0.04 : ip.startsWith('192.168.') ? 0.6 : 18;
    let out = `PING ${h} (${ip}) 56(84) bytes of data.\n`;
    const times = [];
    for (let i = 1; i <= Math.min(n, 20); i++) {
      if (unreachable) { out += `From 192.168.1.50 icmp_seq=${i} Destination Host Unreachable\n`; continue; }
      const t = +(base * (0.8 + Math.random() * 0.5)).toFixed(base < 1 ? 3 : 1);
      times.push(t);

    const recv = times.length;
    out += `\n--- ${h} ping statistics ---\n${n} packets transmitted, ${recv} received, ${Math.round((1 - recv / n) * 100)}% packet loss, time ${n * 1000 - 999}ms\n`;
    if (recv) out += `rtt min/avg/max/mdev = ${Math.min(...times).toFixed(3)}/${(times.reduce((s, x) => s + x, 0) / recv).toFixed(3)}/${Math.max(...times).toFixed(3)}/0.112 ms\n`;
    if (!o.c && ctx.tty) out += C.dim + '(En Linux real, ping sin -c sigue enviando paquetes hasta que pulsas Ctrl+C.)' + C.off + '\n';

  def('tar', (a, ctx) => {
    const S = ctx.S;
    let flags = '', rest = [], file = null, dir = null;
    for (let i = 0; i < a.length; i++) {
      const x = a[i];
      if (x === '-C') { dir = a[++i]; continue; }
      if (x.startsWith('--')) continue;
      if (i === 0 && /^[a-zA-Z]+$/.test(x) && !x.includes('.')) flags += x;
      else if (x.startsWith('-')) flags += x.slice(1);
      else rest.push(x);
    }
    if (flags.includes('f')) {
      // el archivo va tras f (o es el primer operando libre)
      file = rest.shift();
    }
    const v = flags.includes('v');
    if (!/[cxt]/.test(flags)) { ctx.err('tar: Debe especificar una de las opciones «-Acdtrux»\nPruebe «tar --help» para más información.\n'); return 2; }
    if (!file) { ctx.err('tar: Se rehúsa a escribir datos de archivo en una terminal.\n'); return 2; }
    if (flags.includes('c')) {
      if (!rest.length) { ctx.err('tar: Cobardemente se rehúsa a crear un archivo vacío\n'); return 2; }
      const entries = [];
      for (const src of rest) {
        const r = get(S, src);
        if (r.err) { ctx.err(`tar: ${src}: No se puede efectuar stat: ${r.err}\n`); continue; }
        const absS = abspath(S, src);
        walk(S, absS, r.node, (p, n) => {
          const rel = (src.replace(/\/$/, '') + p.slice(absS.length)).replace(/^\//, '');
          entries.push({ p: rel + (n.t === 'd' ? '/' : ''), t: n.t, d: n.data || '', m: n.mode, o: n.owner, l: n.target });
          if (v) ctx.out(rel + (n.t === 'd' ? '/' : '') + '\n');
        });
      }
      if (/^\//.test(rest[0]) && ctx.tty) ctx.err('tar: Eliminando la «/» inicial de los nombres\n');
      const blob = '\x00TAR' + JSON.stringify(entries);
      try { writeFile(S, file, flags.includes('z') ? '\x00GZ' + blob : blob); } catch (e) { ctx.err(`tar: ${file}: ${e.message}\n`); return 2; }
      return 0;
    }
    let data;
    try { data = readFile(S, file); } catch (e) { ctx.err(`tar: ${file}: No se puede abrir: ${e.message}\n`); return 2; }
    if (data.startsWith('\x00GZ')) data = data.slice(3);
    if (!data.startsWith('\x00TAR')) { ctx.err('tar: Esto no parece un archivo tar\n'); return 2; }
    const entries = JSON.parse(data.slice(4));
    if (flags.includes('t')) { entries.forEach(e => ctx.out(v ? `${modeStr({ t: e.t, mode: e.m })} ${e.o}/${e.o} ${pad(e.d.length, 6, true)} ${lsDate(Date.now())} ${e.p}\n` : e.p + '\n')); return 0; }
    const base = dir ? abspath(S, dir) : S.cwd;
    for (const e of entries) {
      const target = norm(base + '/' + e.p);
      const pr = lookup(S, dirname(target));
      if (pr.err) { ctx.err(`tar: ${e.p}: ${pr.err}\n`); continue; }
      if (!can(S, pr.node, 2)) { ctx.err(`tar: ${e.p}: No se puede crear: ${E_ACCES}\n`); continue; }
      const nm = basename(target);
      if (e.t === 'd') { if (!pr.node.c[nm]) pr.node.c[nm] = mk(S, 'd', S.user, primaryGroup(S, S.user), e.m); }
      else if (e.t === 'l') pr.node.c[nm] = mk(S, 'l', S.user, primaryGroup(S, S.user), 0o777, { target: e.l });
      else { const n = mk(S, 'f', S.user, primaryGroup(S, S.user), e.m); n.data = e.d; pr.node.c[nm] = n; }
      if (v) ctx.out(e.p + '\n');
    }
    return 0;
  });
  def('gzip gunzip', (a, ctx) => {

  function execLine(S, line, hooks = {}) {
    const out = [];
    const log = [];
    const ctx = {
      S, log, tty: true, stdin: null, counter: { n: 0 }, shared: { editor: null },
      frame: S.frame || (S.frame = { args: [], name: 'bash', env: S.env }),
      out: s => out.push({ t: 'o', s }), err: s => out.push({ t: 'e', s }),
      onClear: () => { out.length = 0; out.push({ t: 'clear' }); }
    };
    S.frame.env = S.env;
    let code = 0;
    try {
      const ast = parse(line);
      code = execList(ast, ctx);
    } catch (e) {
      if (e instanceof Incomplete) return { incomplete: true };
      if (e instanceof ShellError) { out.push({ t: 'e', s: 'bash: ' + e.message + '\n' }); code = e.code || 2; }
      else if (e instanceof ExitSignal) code = e.code;
      else { out.push({ t: 'e', s: 'error interno del simulador: ' + e.message + '\n' }); console.error(e); code = 1; }
    }
    S.lastCode = code;
    return { out, log, code, editor: ctx.shared.editor };
  }

  function complete(S, line) {
    // devuelve {replace: texto completado, options: [...]}
    const m = line.match(/(^|[\s|;&<>]+)([^\s|;&<>]*)$/);
    const word = m ? m[2] : '';
    const before = line.slice(0, line.length - word.length);
    const isCmd = /^\s*(sudo\s+)?$/.test(before) || /[|;&]\s*$/.test(before);
    let cands = [];
    if (isCmd && !word.includes('/')) {
      cands = Object.keys(CMDS).filter(c => c.startsWith(word) && /^[a-z]/.test(c) && (!PKG_CMDS[c] || S.installed.includes(PKG_CMDS[c]))).concat(Object.keys(S.aliases).filter(c => c.startsWith(word)));
      cands = [...new Set(cands)].sort();
      if (word.startsWith('.')) cands = [];
    }
    if (!cands.length || word.includes('/') || !isCmd) {
      const slash = word.lastIndexOf('/');
      const dirPart = slash >= 0 ? word.slice(0, slash + 1) : '';
      const filePart = slash >= 0 ? word.slice(slash + 1) : word;
      const r = get(S, dirPart || '.');
      if (!r.err && r.node.t === 'd' && can(S, r.node, 4)) {
        cands = Object.keys(r.node.c).filter(k => k.startsWith(filePart) && (filePart.startsWith('.') || !k.startsWith('.'))).sort(cmpName).map(k => {
          let n = r.node.c[k];
          if (n.t === 'l') { const t = get(S, (dirPart || '') + k); if (!t.err) n = t.node; }
          return dirPart + k + (n.t === 'd' ? '/' : '');
        });
        const cmdName = before.trim().split(/\s+/)[0];
        if (cmdName === 'cd' || cmdName === 'rmdir') cands = cands.filter(c => c.endsWith('/'));
      }
    }
    if (!cands.length) return { line, options: [] };
    if (cands.length === 1) {
      const c = cands[0];
      return { line: before + c + (c.endsWith('/') ? '' : ' '), options: [] };
    }
    let pre = cands[0];
    for (const c of cands) while (!c.startsWith(pre)) pre = pre.slice(0, -1);
    return { line: before + (pre.length > word.length ? pre : word), options: cands.map(c => c.replace(/.*\/(?=.)/, '')) };
  }

// ================= SIMULADORES DE SISTEMAS OPERATIVOS =================
const Sims = (() => {
  // procs: [{name, arrival, burst, prio}]; devuelve {gantt:[{name,start,end}], rows:[...], avgWait, avgTurn, avgResp}
  function schedule(procs, algo, quantum = 2) {
    const ps = procs.map((p, i) => ({ ...p, idx: i, rem: p.burst, first: null, finish: null }));
    const gantt = [];
    let t = 0;
    const push = (name, s, e) => {
      const last = gantt[gantt.length - 1];
      if (last && last.name === name && last.end === s) last.end = e; else gantt.push({ name, start: s, end: e });
    };
    const done = () => ps.every(p => p.rem === 0);
    const byArrival = (a, b) => a.arrival - b.arrival || a.idx - b.idx;
    if (algo === 'FCFS' || algo === 'SJF' || algo === 'PRIO') {
      while (!done()) {
        const ready = ps.filter(p => p.rem > 0 && p.arrival <= t);
        if (!ready.length) { const nx = Math.min(...ps.filter(p => p.rem > 0).map(p => p.arrival)); push('—', t, nx); t = nx; continue; }
        let pick;
        if (algo === 'FCFS') pick = ready.sort(byArrival)[0];
        else if (algo === 'SJF') pick = ready.sort((a, b) => a.burst - b.burst || byArrival(a, b))[0];
        else pick = ready.sort((a, b) => a.prio - b.prio || byArrival(a, b))[0];
        pick.first = t; push(pick.name, t, t + pick.rem); t += pick.rem; pick.rem = 0; pick.finish = t;
      }
    } else if (algo === 'SRTF' || algo === 'PRIOP') {
      while (!done()) {
        const ready = ps.filter(p => p.rem > 0 && p.arrival <= t);
        if (!ready.length) { const nx = Math.min(...ps.filter(p => p.rem > 0).map(p => p.arrival)); push('—', t, nx); t = nx; continue; }
        const pick = algo === 'SRTF' ? ready.sort((a, b) => a.rem - b.rem || byArrival(a, b))[0] : ready.sort((a, b) => a.prio - b.prio || byArrival(a, b))[0];
        if (pick.first === null) pick.first = t;
        push(pick.name, t, t + 1); t += 1; pick.rem -= 1;
        if (pick.rem === 0) pick.finish = t;
      }
    } else if (algo === 'RR') {
      const q = Math.max(1, quantum | 0);
      const queue = [];
      const sorted = ps.slice().sort(byArrival);
      let ai = 0;
      const admit = upTo => { while (ai < sorted.length && sorted[ai].arrival <= upTo) queue.push(sorted[ai++]); };
      admit(t);
      while (!done()) {
        if (!queue.length) { const nx = sorted[ai].arrival; push('—', t, nx); t = nx; admit(t); continue; }
        const p = queue.shift();
        if (p.first === null) p.first = t;
        const run = Math.min(q, p.rem);
        push(p.name, t, t + run); t += run; p.rem -= run;
        admit(t); // los que llegan durante el quantum entran antes que el expulsado
        if (p.rem > 0) queue.push(p); else p.finish = t;
      }
    }
    const rows = ps.map(p => ({ name: p.name, arrival: p.arrival, burst: p.burst, prio: p.prio, finish: p.finish, turnaround: p.finish - p.arrival, wait: p.finish - p.arrival - p.burst, response: p.first - p.arrival }));
    const avg = k => rows.reduce((s, r) => s + r[k], 0) / rows.length;
    return { gantt, rows, avgWait: avg('wait'), avgTurn: avg('turnaround'), avgResp: avg('response'), total: t };
  }

  // reemplazo de páginas. refs: array de números; devuelve {steps:[{ref, frames:[...], fault, victim}], faults}
  function paging(refs, nframes, algo) {
    const frames = [];
    const loadTime = {}, lastUse = {};
    const steps = [];
    let faults = 0, fifoPtr = 0;
    refs.forEach((r, i) => {
      let fault = false, victim = null, slot = frames.indexOf(r);
      if (slot >= 0) { lastUse[r] = i; }
      else {
        fault = true; faults++;
        if (frames.length < nframes) { frames.push(r); slot = frames.length - 1; }
        else {
          let vi;
          if (algo === 'FIFO') { vi = fifoPtr; fifoPtr = (fifoPtr + 1) % nframes; }
          else if (algo === 'LRU') { vi = frames.reduce((best, f, k) => lastUse[f] < lastUse[frames[best]] ? k : best, 0); }
          else { // OPT
            let far = -1; vi = 0;
            frames.forEach((f, k) => { const nx = refs.indexOf(f, i + 1); const d = nx < 0 ? Infinity : nx; if (d > far) { far = d; vi = k; } });
          }
          victim = frames[vi]; frames[vi] = r; slot = vi;
        }
        loadTime[r] = i; lastUse[r] = i;
      }
      steps.push({ ref: r, frames: frames.slice(), fault, victim, slot });
    });
    return { steps, faults, hits: refs.length - faults };
  }
  return { schedule, paging };
})();

function removeUser(S, u) { if (S.users[u]) { delete S.users[u]; Engine.del(S, '/home/' + u); } if (S.groups[u]) delete S.groups[u]; Object.values(S.groups).forEach(g => g.members = g.members.filter(m => m !== u)); }
function addProc(S, p) { S.procs = S.procs.filter(x => x.pid !== p.pid); S.procs.push(Object.assign({ ppid: 1321, state: 'S', cpu: 0, mem: 0.2, nice: 0, tty: 'pts/0', start: '03:58', vsz: 24000, rss: 9000 }, p)); }
function makeLog(n) {
  const lv = ['INFO', 'INFO', 'INFO', 'WARN', 'INFO', 'ERROR', 'INFO', 'DEBUG'];
  const msgs = { INFO: ['Petición atendida en 23 ms', 'Usuario autenticado', 'Caché actualizada', 'Conexión cerrada'], WARN: ['Uso de memoria al 85%', 'Respuesta lenta de la base de datos', 'Reintentando conexión'], ERROR: ['No se pudo conectar a la base de datos', 'Tiempo de espera agotado', 'Archivo de configuración no encontrado'], DEBUG: ['Variable x=42', 'Entrando en procesar_pedido()'] };
  const out = [];
  for (let i = 0; i < n; i++) {
    const l = lv[(i * 7 + 3) % lv.length];
    const m = msgs[l][i % msgs[l].length];
    out.push(`2026-10-13 0${3 + Math.floor(i / 30)}:${String((i * 2) % 60).padStart(2, '0')}:${String((i * 17) % 60).padStart(2, '0')} [${l}] ${m}`);
  }
  return out.join('\n') + '\n';
}

<h2>Tres canales por proceso</h2>
<table class="t">
<tr><th>Descriptor</th><th>Nombre</th><th>Por defecto</th></tr>

<h2>Tuberías: la idea central de Unix</h2>
<p>El operador <code>|</code> conecta la stdout de una orden con la stdin de la siguiente. Cada programa hace una sola cosa bien, y los combinas:</p>

<tr><td><code>wc -l</code></td><td>cuenta líneas</td></tr>
<tr><td><code>head</code>, <code>tail</code></td><td>se quedan con el principio o el final</td></tr>
<tr><td><code>tee f</code></td><td>deja pasar los datos y además los guarda en <code>f</code></td></tr>

<pre class="try">tail -n +2 ~/datos/ventas.csv | sort -t, -k4 -n | tail -1</pre>
<div class="so"><b>Para tu clase de SO</b> Una tubería es un mecanismo de <strong>comunicación entre procesos (IPC)</strong>. El shell crea un <code>pipe()</code> (un búfer en el kernel con un extremo de escritura y otro de lectura), hace <code>fork()</code> para cada orden y conecta los descriptores con <code>dup2()</code>. Todas las órdenes corren a la vez; si el búfer se llena, el escritor se bloquea, y si está vacío, se bloquea el lector. Es el problema clásico de <em>productor-consumidor</em> resuelto por el kernel.</div>`,

<h2>Linux es multiusuario</h2>
<p>Cada usuario tiene un número, el <strong>UID</strong>, y pertenece a un grupo principal (<strong>GID</strong>) y a otros grupos secundarios. El kernel solo entiende números; los nombres están en archivos de texto:</p>
<pre class="ex">estudiante:x:1000:1000:Estudiante,,,:/home/estudiante:/bin/bash
   │       │  │    │        │              │               └ shell
   │       │  │    │        │              └ directorio personal
   │       │  │    │        └ comentario (nombre completo)
   │       │  │    └ GID del grupo principal
   │       │  └ UID
   │       └ la contraseña está en /etc/shadow
   └ nombre de usuario</pre>
<table class="t">
<tr><td><code>/etc/passwd</code></td><td>cuentas (lo puede leer cualquiera)</td></tr>
<tr><td><code>/etc/shadow</code></td><td>contraseñas cifradas (solo root)</td></tr>
<tr><td><code>/etc/group</code></td><td>grupos y sus miembros</td></tr>
</table>
<p><strong>root</strong> tiene UID 0 y puede hacerlo todo. Los usuarios del sistema (UID &lt; 1000) ejecutan servicios; las personas empiezan en 1000.</p>
<pre class="try">id</pre>
<pre class="try">groups</pre>
<h2>sudo y su</h2>
<ul>
<li><code>sudo orden</code> ejecuta UNA orden como root. Pide <em>tu</em> contraseña y queda registrado en <code>/var/log/auth.log</code>. Solo funciona si estás en el grupo <code>sudo</code>.</li>
<li><code>su - usuario</code> abre un shell completo como otro usuario. Se sale con <code>exit</code>.</li>
<li><code>sudo -i</code> abre un shell de root. El prompt cambia a <code>#</code> para recordártelo.</li>
</ul>
<p>Trabajar siempre como root es mala idea: un error tipográfico puede destruir el sistema. Es el <strong>principio de mínimo privilegio</strong>.</p>
<h2>Gestionar cuentas (requiere sudo)</h2>
<pre class="ex">sudo useradd -m -s /bin/bash ana   # -m crea /home/ana
sudo passwd ana                     # le pone contraseña
sudo groupadd devs                  # crea un grupo
sudo usermod -aG devs ana           # añade ana a devs (¡la -a es clave!)
sudo userdel -r ana                 # borra la cuenta y su home</pre>
<div class="warn"><b>Error clásico</b> <code>usermod -G devs ana</code> sin <code>-a</code> <em>sustituye</em> todos los grupos secundarios de ana por devs. Si se lo haces a tu propio usuario, pierdes el grupo sudo.</div>
<div class="so"><b>Para tu clase de SO</b> Esto es <strong>protección</strong>: el SO asocia a cada proceso unas credenciales (UID/GID efectivos) y en cada acceso a un recurso comprueba la política. Las matrices de acceso se implementan en Linux como listas por objeto (los permisos de cada archivo, siguiente módulo). sudo es un ejemplo de cambio de dominio de protección controlado.</div>`,

<h2>Notación octal</h2>
<p>Cada trío se escribe como la suma <strong>r=4, w=2, x=1</strong>:</p>
<table class="t">
<tr><td><code>7</code> = rwx</td><td><code>6</code> = rw-</td><td><code>5</code> = r-x</td><td><code>4</code> = r--</td><td><code>0</code> = ---</td></tr>
</table>
<table class="t">
<tr><td><code>644</code></td><td>rw-r--r--</td><td>archivos normales</td></tr>
<tr><td><code>600</code></td><td>rw-------</td><td>privados (claves SSH)</td></tr>
<tr><td><code>755</code></td><td>rwxr-xr-x</td><td>programas y directorios públicos</td></tr>
<tr><td><code>750</code></td><td>rwxr-x---</td><td>directorio solo para el equipo</td></tr>
</table>
<h2>chmod, chown y chgrp</h2>
<pre class="ex">chmod 640 archivo        # octal
chmod u+x script.sh      # simbólico: al dueño (u) le añade (+) ejecución (x)
chmod go-w archivo       # a grupo y otros les quita escritura
chmod -R 750 carpeta     # recursivo
sudo chown ana archivo   # cambiar dueño (solo root)
chgrp devs archivo       # cambiar grupo (a uno al que perteneces)</pre>
<p>Para ejecutar un script del directorio actual escribe <code>./script.sh</code>: el shell no busca programas en el directorio actual por seguridad.</p>
<h2>umask: los permisos por defecto</h2>
<p>Un archivo nuevo parte de <code>666</code> y un directorio de <code>777</code>; la <strong>umask</strong> indica qué bits quitar. Con <code>umask 022</code>: archivos <code>644</code>, directorios <code>755</code>. Con <code>027</code>: <code>640</code> y <code>750</code>.</p>
<h2>Bits especiales</h2>
<ul><li><b>sticky</b> (<code>t</code>): en <code>/tmp</code> (<code>drwxrwxrwt</code>) todos escriben, pero cada uno solo borra lo suyo.</li><li><b>setuid</b> (<code>s</code>): el programa corre con los permisos de su dueño. <code>/usr/bin/passwd</code> lo usa para poder escribir en <code>/etc/shadow</code>.</li></ul>
<div class="so"><b>Para tu clase de SO</b> El nodo-i guarda dueño, grupo y 12 bits de modo. En cada <code>open()</code> el kernel compara el UID efectivo del proceso: si es el dueño usa el primer trío, si comparte grupo el segundo, y si no, el tercero. Solo se mira un trío: si eres el dueño y tu trío es <code>---</code>, no puedes leer aunque "otros" tenga <code>r</code>.</div>`,

<h2>El problema</h2>
<p>Hay más procesos listos que núcleos. El <strong>planificador</strong> decide cuál usa la CPU y durante cuánto. Cada proceso alterna <em>ráfagas de CPU</em> y esperas de E/S; aquí simulamos una sola ráfaga por proceso.</p>
<h2>Métricas</h2>
<table class="t">
<tr><td><b>Llegada</b> (A)</td><td>cuándo entra en la cola de listos</td></tr>
<tr><td><b>Ráfaga</b> (B)</td><td>tiempo de CPU que necesita</td></tr>
<tr><td><b>Finalización</b> (F)</td><td>cuándo termina</td></tr>
<tr><td><b>Retorno</b> = F − A</td><td>tiempo total en el sistema (<em>turnaround</em>)</td></tr>
<tr><td><b>Espera</b> = Retorno − B</td><td>tiempo en la cola de listos sin usar la CPU</td></tr>
<tr><td><b>Respuesta</b></td><td>desde que llega hasta que usa la CPU por primera vez</td></tr>
</table>
<h2>Algoritmos</h2>
<table class="t">
<tr><td><b>FCFS</b></td><td>Primero en llegar, primero en ser servido. Simple pero sufre el <em>efecto convoy</em>: un proceso largo retrasa a todos los cortos.</td></tr>
<tr><td><b>SJF</b></td><td>El trabajo más corto primero (no expropiativo). Minimiza la espera media, pero hay que conocer o estimar las ráfagas, y los largos pueden sufrir <em>inanición</em>.</td></tr>
<tr><td><b>SRTF</b></td><td>Versión expropiativa de SJF: si llega uno con menos tiempo restante, expulsa al actual.</td></tr>
<tr><td><b>Round Robin</b></td><td>Cada proceso usa la CPU como máximo un <em>quantum</em> y vuelve al final de la cola. Buen tiempo de respuesta. Quantum muy pequeño = mucho cambio de contexto; muy grande = se parece a FCFS.</td></tr>
<tr><td><b>Prioridades</b></td><td>Se elige el de mayor prioridad (aquí: número menor = más prioridad). Riesgo de inanición; se corrige con <em>envejecimiento</em> (aging).</td></tr>

    theory: `
<h2>Direcciones lógicas y físicas</h2>
<p>Cada proceso cree tener toda la memoria para él: trabaja con <strong>direcciones lógicas (virtuales)</strong>. La <strong>MMU</strong> del procesador las traduce a <strong>direcciones físicas</strong> usando la <strong>tabla de páginas</strong> que mantiene el SO. Así los procesos quedan aislados entre sí.</p>
<h2>Paginación</h2>
<p>La memoria virtual se divide en <strong>páginas</strong> y la física en <strong>marcos</strong> del mismo tamaño (en Linux, normalmente 4 KB). Una dirección lógica se parte en dos:</p>
<pre class="ex">página        = dirección ÷ tamaño_página   (parte entera)
desplazamiento = dirección mod tamaño_página
física        = marco × tamaño_página + desplazamiento</pre>
<p>Ejemplo con páginas de 4096 bytes: la dirección 8200 está en la página 2 (8200 ÷ 4096 = 2,0…) con desplazamiento 8 (8200 − 8192).</p>
<h2>Fallos de página y memoria virtual</h2>
<p>No todas las páginas tienen que estar en RAM. Si el proceso accede a una que no está, la MMU genera un <strong>fallo de página</strong>; el SO la trae del disco (del área de <em>swap</em> o del archivo ejecutable) a un marco libre. Si no hay marcos libres, debe <strong>reemplazar</strong> una página: ¿cuál?</p>
<table class="t">
<tr><td><b>FIFO</b></td><td>la que lleva más tiempo cargada. Fácil, pero puede expulsar páginas muy usadas y sufre la <em>anomalía de Belady</em>: más marcos pueden dar más fallos.</td></tr>
<tr><td><b>LRU</b></td><td>la que lleva más tiempo sin usarse. Muy buena en la práctica; exacta es cara, así que se aproxima (algoritmo del reloj, bit de referencia).</td></tr>
<tr><td><b>Óptimo (OPT)</b></td><td>la que tardará más en volver a usarse. Imposible en la realidad (requiere conocer el futuro); sirve como cota para comparar.</td></tr>
</table>
<p>Si los procesos necesitan más marcos de los que hay, el sistema pasa más tiempo trayendo páginas que trabajando: es la <strong>hiperpaginación</strong> (<em>thrashing</em>).</p>
<h2>En Linux</h2>
<p><code>free -h</code> muestra la RAM y la swap; <code>/proc/meminfo</code> da el detalle. La columna "búf/caché" es memoria que el kernel usa como caché de disco y devuelve cuando hace falta: fíjate en "disponible". Si la memoria se agota del todo, el <em>OOM killer</em> elige un proceso y lo mata.</p>
<p>Usa el simulador: escribe una cadena de referencias, elige el número de marcos y el algoritmo. Las celdas resaltadas son fallos.</p>`,

    setup(S) { wipe(S, 'enlaces'); H(S, 'enlaces/original.txt', 'Contenido del archivo original. Los datos viven en el nodo-i, no en el nombre.\n'); },
    theory: `
<h2>Nombre, nodo-i y datos</h2>
<p>En los sistemas de archivos de Unix (ext4, XFS…), un archivo tiene tres partes:</p>
<ul>
<li>El <strong>nodo-i</strong> (inode): un registro con el tipo, permisos, dueño, tamaño, fechas, número de enlaces y punteros a los bloques de datos. Tiene un número único dentro del sistema de archivos. <em>No guarda el nombre.</em></li>
<li>Los <strong>bloques de datos</strong> con el contenido.</li>
<li>Una o más <strong>entradas de directorio</strong> que asocian un nombre a ese número de nodo-i.</li>
</ul>
<pre class="try">ls -i ~/enlaces</pre>
<pre class="try">stat ~/enlaces/original.txt</pre>
<h2>Enlaces duros y simbólicos</h2>
<table class="t">
<tr><th></th><th>Enlace duro <code>ln a b</code></th><th>Enlace simbólico <code>ln -s a b</code></th></tr>
<tr><td>Qué es</td><td>otro nombre para el mismo nodo-i</td><td>un archivo pequeño que contiene una ruta</td></tr>
<tr><td>Nodo-i</td><td>el mismo que el original</td><td>uno propio</td></tr>
<tr><td>Si borras el original</td><td>los datos siguen ahí</td><td>queda roto (apunta a nada)</td></tr>
<tr><td>Directorios / otros discos</td><td>no se permite</td><td>sí</td></tr>
</table>
<p>Los datos de un archivo solo se liberan cuando su <strong>contador de enlaces</strong> llega a 0 y nadie lo tiene abierto. Por eso la llamada al sistema para borrar se llama <code>unlink()</code>.</p>
<h2>Discos, particiones y montaje</h2>
<p>Un disco (<code>/dev/sda</code>) se divide en particiones (<code>/dev/sda1</code>), cada una con su sistema de archivos. Para usarlo se <strong>monta</strong> en un directorio: <code>mount /dev/sdb1 /mnt</code>. Los montajes automáticos al arrancar se definen en <code>/etc/fstab</code>.</p>
<pre class="try">lsblk</pre>
<pre class="try">df -h</pre>
<pre class="try">du -sh ~/*</pre>
<p><code>df</code> dice cuánto espacio queda en cada sistema de archivos; <code>du</code> cuánto ocupa un directorio.</p>
<div class="so"><b>Para tu clase de SO</b> ext4 usa <strong>extents</strong> (rangos contiguos de bloques) en lugar de la vieja tabla de punteros directos e indirectos, y un <strong>journal</strong>: antes de modificar metadatos escribe lo que va a hacer en un registro, para poder recuperar la consistencia tras un corte de luz sin revisar todo el disco. Linux añade encima el <strong>VFS</strong> (sistema de archivos virtual), una capa común que permite que <code>ls</code> funcione igual sobre ext4, FAT, NFS o <code>/proc</code>.</div>`,
    tasks: [

      { t: 'Crea un enlace <b>duro</b> llamado <code>~/enlaces/duro.txt</code> que apunte a <code>original.txt</code>.', hint: 'ln origen nombre_enlace (sin -s).', sol: 'ln ~/enlaces/original.txt ~/enlaces/duro.txt', check: c => c.ino(HOME + '/enlaces/duro.txt') && c.ino(HOME + '/enlaces/duro.txt') === c.ino(HOME + '/enlaces/original.txt') },

      { t: 'Compara los tres con <code>ls -li</code>: fíjate en los números de nodo-i y en el contador de enlaces.', hint: 'ls -li ~/enlaces', sol: 'ls -li ~/enlaces', check: c => c.ran('ls', a => a.some(x => /^-\w*i/.test(x)) && a.some(x => /^-\w*l/.test(x))) && c.out.includes('simbolico.txt') },
      { t: 'Borra <code>original.txt</code> y demuestra que <code>duro.txt</code> sigue teniendo los datos.', hint: 'rm original.txt y luego cat duro.txt.', sol: 'rm ~/enlaces/original.txt && cat ~/enlaces/duro.txt', check: c => !c.exists(HOME + '/enlaces/original.txt') && c.out.includes('Contenido del archivo original') },
      { t: 'Intenta leer <code>simbolico.txt</code>: comprobarás que el enlace quedó roto.', hint: 'cat simbolico.txt dará "No existe el archivo".', sol: 'cat ~/enlaces/simbolico.txt', check: c => c.ranEver('cat', (a, e) => a.some(x => x.includes('simbolico')) && e.code !== 0) },
      { t: 'Muestra el espacio libre de los sistemas de archivos en formato legible.', hint: 'df con -h.', sol: 'df -h', check: c => c.ran('df') },
      { t: 'Muestra cuánto ocupa en total tu directorio personal.', hint: 'du -sh ~', sol: 'du -sh ~', check: c => c.ran('du', a => a.some(x => /s/.test(x))) }
    ]

    theory: `
<h2>Un script es una lista de órdenes en un archivo</h2>
<pre class="ex">#!/bin/bash
# Mi primer script
echo "Hola Mundo"</pre>
<p>La primera línea, el <strong>shebang</strong> <code>#!</code>, indica qué intérprete lo ejecuta. Para lanzarlo: <code>chmod +x hola.sh</code> y luego <code>./hola.sh</code>. También puedes hacer <code>bash hola.sh</code> sin dar permisos.</p>
<h2>Variables</h2>
<pre class="ex">nombre="Ana"           # ¡sin espacios alrededor del =!
echo "Hola, $nombre"
hoy=$(date +%F)        # guarda la salida de una orden
total=$((3 + 4 * 2))   # aritmética entera: 11</pre>
<p>Comillas dobles <code>"..."</code> expanden variables; simples <code>'...'</code> no expanden nada.</p>
<h2>Argumentos</h2>
<table class="t"><tr><td><code>$1</code>, <code>$2</code>…</td><td>argumentos</td></tr><tr><td><code>$#</code></td><td>cuántos argumentos hay</td></tr><tr><td><code>$@</code></td><td>todos los argumentos</td></tr><tr><td><code>$0</code></td><td>nombre del script</td></tr><tr><td><code>$?</code></td><td>código de salida de la última orden (0 = éxito)</td></tr></table>
<h2>Condiciones</h2>
<pre class="ex">if [ "$1" -gt 10 ]; then
  echo "mayor que 10"
elif [ "$1" -eq 10 ]; then
  echo "igual a 10"
else
  echo "menor que 10"
fi</pre>
<p>Dentro de <code>[ ]</code> los espacios son obligatorios. Números: <code>-eq -ne -lt -le -gt -ge</code>. Texto: <code>=</code>, <code>!=</code>, <code>-z</code> (vacío). Archivos: <code>-f</code> existe y es archivo, <code>-d</code> directorio, <code>-x</code> ejecutable.</p>
<h2>Bucles</h2>
<pre class="ex">for f in *.txt; do
  echo "Procesando $f"
done

for i in $(seq 1 5); do echo $i; done

n=3
while [ $n -gt 0 ]; do
  echo $n
  n=$((n - 1))
done</pre>
<p>Para escribir los scripts usa <code>nano</code>. También puedes probar bucles directamente en la terminal, en una sola línea separando con <code>;</code>.</p>
<pre class="try">for i in 1 2 3; do echo "vuelta $i"; done</pre>
<div class="so"><b>Para tu clase de SO</b> Al ejecutar <code>./script.sh</code>, el kernel lee el <code>#!</code> en la llamada <code>execve()</code> y lanza el intérprete indicado pasándole la ruta del script. El script corre en un proceso hijo: un <code>cd</code> dentro de él no cambia el directorio de tu terminal. Si quieres que sí lo haga, usa <code>source script.sh</code>.</div>`,
    tasks: [
      { t: 'Con nano, crea <code>~/scripts/hola.sh</code> con el shebang <code>#!/bin/bash</code> y una línea que imprima <code>Hola Mundo</code>.', hint: 'nano ~/scripts/hola.sh. Primera línea #!/bin/bash, segunda echo "Hola Mundo". Ctrl+O, Ctrl+X.', sol: 'nano ~/scripts/hola.sh', check: c => { const t = c.read(HOME + '/scripts/hola.sh') || ''; return /^#!\s*\/(usr\/)?bin\/(env )?(ba)?sh/.test(t) && /echo/.test(t) && /hola mundo/i.test(t); } },
      { t: 'Dale permiso de ejecución y ejecútalo con <code>./hola.sh</code>.', hint: 'cd ~/scripts && chmod +x hola.sh && ./hola.sh', sol: 'cd ~/scripts && chmod +x hola.sh && ./hola.sh', check: c => c.ran(/hola\.sh$/, (a, e) => e.code === 0) && /hola mundo/i.test(c.out) },
      { t: 'Crea <code>~/scripts/saludo.sh</code> que salude al nombre que reciba como primer argumento: <code>./saludo.sh Ana</code> debe imprimir <code>Hola, Ana</code>.', hint: 'Usa $1: echo "Hola, $1". No olvides chmod +x.', sol: 'nano ~/scripts/saludo.sh', check: c => { const r = c.trial('bash ~/scripts/saludo.sh Zoila'); return /hola,?\s*zoila/i.test(r) && c.exists(HOME + '/scripts/saludo.sh'); } },
      { t: 'Crea <code>~/scripts/par.sh</code> que reciba un número y diga <code>par</code> o <code>impar</code>.', hint: 'if [ $(($1 % 2)) -eq 0 ]; then echo "par"; else echo "impar"; fi', sol: 'nano ~/scripts/par.sh', check: c => { const a = c.trial('bash ~/scripts/par.sh 14').toLowerCase(), b = c.trial('bash ~/scripts/par.sh 7').toLowerCase(); return /\bpar\b/.test(a) && !/impar/.test(a) && /impar/.test(b); } },
      { t: 'Crea <code>~/scripts/crear.sh</code> que, con un bucle <code>for</code>, cree los archivos <code>archivo1.txt</code> a <code>archivo5.txt</code> dentro de <code>~/scripts/salida</code>. Ejecútalo.', hint: 'mkdir -p ~/scripts/salida; for i in $(seq 1 5); do touch ~/scripts/salida/archivo$i.txt; done', sol: 'nano ~/scripts/crear.sh', check: c => [1, 2, 3, 4, 5].every(i => c.isFile(`${HOME}/scripts/salida/archivo${i}.txt`)) && /for|while/.test(c.read(HOME + '/scripts/crear.sh') || '') },

    theory: `
<h2>Gestión de paquetes</h2>
<p>En Linux el software se instala desde <strong>repositorios</strong>: servidores de la distribución con paquetes firmados. En la familia Debian, <code>dpkg</code> instala archivos <code>.deb</code> y <code>apt</code> resuelve dependencias y los descarga.</p>
<pre class="ex">sudo apt update          # actualiza la LISTA de paquetes (no instala nada)
sudo apt upgrade         # actualiza lo instalado
sudo apt install tree    # instala
sudo apt remove tree     # desinstala
apt search servidor web  # busca
apt show nginx           # detalles</pre>
<p>En la familia Red Hat el equivalente es <code>sudo dnf install paquete</code>.</p>
<h2>Servicios con systemd</h2>
<p>Un <strong>servicio</strong> (o <em>demonio</em>) es un proceso que corre en segundo plano: el servidor web, SSH, cron… <code>systemd</code> (PID 1) los arranca y vigila.</p>
<pre class="ex">systemctl status ssh            # ¿está activo?
sudo systemctl start nginx      # arrancar
sudo systemctl stop nginx       # detener
sudo systemctl restart nginx    # reiniciar
sudo systemctl enable nginx     # arrancar al encender el equipo
journalctl -u nginx             # sus registros</pre>
<h2>Red</h2>
<table class="t">
<tr><td><code>ip a</code></td><td>interfaces y direcciones IP</td></tr>
<tr><td><code>ip r</code></td><td>rutas; la <em>default</em> es la puerta de enlace</td></tr>
<tr><td><code>ping -c 4 host</code></td><td>¿responde ese equipo? ¿con qué latencia?</td></tr>
<tr><td><code>cat /etc/hosts</code></td><td>nombres resueltos localmente, antes que el DNS</td></tr>
<tr><td><code>ss -tuln</code></td><td>puertos en escucha (22 SSH, 80 HTTP, 443 HTTPS)</td></tr>
<tr><td><code>curl URL</code></td><td>pide una página web desde la terminal</td></tr>
</table>
<h2>Empaquetar y comprimir</h2>
<pre class="ex">tar -czvf copia.tar.gz carpeta/   # c crear, z gzip, v ver, f archivo
tar -tzf copia.tar.gz             # t listar contenido
tar -xzvf copia.tar.gz            # x extraer</pre>
<div class="so"><b>Para tu clase de SO</b> Un demonio es un proceso sin terminal asociada (TTY <code>?</code> en <code>ps</code>) cuyo padre es el PID 1. La red es otro recurso que administra el kernel: un programa pide un <em>socket</em>, y el kernel implementa TCP/IP y multiplexa los paquetes entre procesos según el puerto.</div>`,
    tasks: [

      { t: 'Detén nginx y comprueba que <code>curl localhost</code> ahora falla.', hint: 'sudo systemctl stop nginx; curl localhost', sol: 'sudo systemctl stop nginx; curl localhost', check: c => c.S.services.nginx && !c.S.services.nginx.active && c.ran('curl', (a, e) => e.code !== 0) },

<h2>Método de diagnóstico</h2>
<ol>
<li><b>Carga y procesos</b>: <code>uptime</code>, <code>top</code>, <code>ps aux --sort</code>. ¿Quién se come la CPU o la memoria? ¿De qué usuario es?</li>
<li><b>Registros</b>: <code>/var/log</code>, <code>journalctl -u servicio</code>, <code>grep</code> para filtrar errores.</li>
<li><b>Disco</b>: <code>df -h</code> y <code>du</code> para encontrar lo que ocupa espacio.</li>
<li><b>Servicios</b>: <code>systemctl status</code>, <code>systemctl --failed</code>.</li>
<li><b>Permisos</b>: si algo "no se ejecuta" o "no puede escribir", mira <code>ls -l</code>.</li>

<div class="so"><b>Lo que estás repasando</b> Procesos y señales (módulo 9), usuarios y sudo (7), permisos (8), búsqueda (5), tuberías (6), servicios y empaquetado (14).</div>`,

    const v = views.ref;
    v.innerHTML = '';
    const q = el('input', { class: 'q', type: 'search', id: 'ref-q', placeholder: 'Busca una orden o una tarea: "permisos", "comprimir", grep…', 'aria-label': 'Buscar en la chuleta' });
    const list = el('div');
    const draw = () => {
      const term = q.value.trim().toLowerCase();
      list.innerHTML = '';
      for (const [title, names] of REF_GROUPS) {
        const g = el('div', { class: 'refgrid' });
        let count = 0;
        for (const n of names.split(' ')) {
          const m = Engine.MAN[n];
          if (!m) continue;
          if (term && !(n.includes(term) || m[0].toLowerCase().includes(term) || m[2].toLowerCase().includes(term))) continue;
          count++;
          g.append(el('div', { class: 'refc' }, el('h4', {}, n), el('div', { class: 'd' }, m[0]), el('pre', {}, m[3] || m[1]),
            el('details', {}, el('summary', {}, 'Opciones y detalles'), el('pre', {}, m[1] + '\n\n' + m[2]))));
        }
        if (count) list.append(el('section', { class: 'phase' }, el('h3', {}, title), g));
      }
      if (!list.children.length) list.append(el('p', { style: 'color:var(--muted)' }, 'No hay resultados. Prueba con otra palabra.'));
    };
    q.addEventListener('input', draw);
    v.append(el('div', { class: 'ref' }, el('div', { class: 'sec-h' }, el('h2', {}, 'Chuleta de órdenes'), el('p', {}, 'Lo esencial de cada orden. En la terminal, man orden muestra lo mismo.')), q, list));
    draw();
  }

  // ---------- navegación ----------
  function go(name) {
    if (name === 'home') { current = null; renderHome(); show('home'); try { history.replaceState(null, '', '#ruta'); } catch (e) { } }
    else if (name === 'free') { renderFree(); show('free'); try { history.replaceState(null, '', '#terminal'); } catch (e) { } }
    else if (name === 'ref') { renderRef(); show('ref'); try { history.replaceState(null, '', '#chuleta'); } catch (e) { } }
  }
  function refreshAll() {
    renderOverall();
    if (!views.home.hidden) renderHome();
    if (!views.lesson.hidden && current) renderTasks();
  }
  document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
  $('#brand').addEventListener('click', () => go('home'));

  // ---------- arranque ----------
  loadSystem();
  renderOverall();
  const h = (location.hash || '').slice(1);
  if (MODULES.some(m => m.id === h)) openLesson(h);
  else if (h === 'terminal') go('free');
  else if (h === 'chuleta') go('ref');
  else go('home');
  Term.sysmsg('Bienvenido a linux-trainee (Ubuntu 24.04.1 LTS simulado). Escribe help para ver las órdenes.');
})();

</script>

</body>
</html>
